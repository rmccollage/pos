<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#278052">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>StockDesk — Inventory & Billing</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<style>
:root{--bg:#f5f5f2;--surface:#fff;--text:#20211f;--muted:#7a7c75;--border:#e6e7e2;--accent:#30352d;--green:#278052;--red:#c54848;--amber:#b7791f;--r:14px;--nav:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
button,input,select{font:inherit}
button{cursor:pointer}
input,select{font-size:16px;border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;color:var(--text);outline:none;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--green)}
.app{max-width:1100px;margin:auto;padding:18px 18px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--green)}
.badge{font-size:11px;color:var(--muted)}
/* nav: bottom bar on phone, top on desktop */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--border);display:flex;z-index:30}
.nav-btn{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
.nav-btn i{font-style:normal;font-size:21px}
.nav-btn.active{color:var(--green)}
.dot{position:absolute;top:7px;left:calc(50% + 8px);background:var(--amber);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;display:none;align-items:center;justify-content:center;padding:0 4px}
.dot.show{display:flex}
.page{display:none}.page.active{display:block}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.6px}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
h3{margin:0 0 12px;font-size:15px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:650;white-space:nowrap}
.btn.secondary{background:#ececE8;color:#333}
.btn.danger{background:#fff0f0;color:var(--red)}
.btn.green{background:var(--green)}
.btn.small{padding:9px 12px;font-size:13px}
.panel,.stat,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:24px;font-weight:750;margin-top:6px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.muted{color:var(--muted)}.low{color:var(--red);font-weight:700}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .name{font-weight:700}
.item small{color:var(--muted);display:block;margin-top:2px}
.item .right{text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#eef6f1;color:var(--green)}
.chip.low{background:#fff0f0;color:var(--red)}
.card-actions{display:flex;gap:6px;margin-top:12px}
.card-actions .btn{flex:1}
/* inventory grid on larger screens */
@media(min-width:700px){#inventoryList,#historyList{grid-template-columns:1fr 1fr}}
/* bill tabs */
.bill-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.bill-tabs::-webkit-scrollbar{display:none}
.bill-tab{flex:0 0 auto;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:8px 12px;text-align:left;min-width:108px}
.bill-tab b{display:block;font-size:13px}
.bill-tab span{font-size:12px;color:var(--muted)}
.bill-tab.active{border-color:var(--green);background:#eef6f1}
.bill-tab.add{display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:700;border-style:dashed;min-width:90px}
.billing-grid{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.scan-row{display:flex;gap:8px;position:relative}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px #0002;z-index:10;margin-top:4px;overflow:hidden;display:none}
.suggest.show{display:block}
.suggest button{display:flex;justify-content:space-between;width:100%;border:0;background:#fff;padding:13px;border-bottom:1px solid var(--border);text-align:left}
.suggest button:last-child{border:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{border:1px solid var(--border);background:#fff;border-radius:9px;width:38px;height:38px;font-size:18px}
.qty strong{min-width:30px;text-align:center}
.summary-line{display:flex;justify-content:space-between;padding:7px 0}
.summary-line.total{border-top:1px solid var(--border);margin-top:6px;padding-top:12px;font-size:20px;font-weight:800}
.checkout{width:100%;margin-top:12px;padding:15px;font-size:16px}
.discard{margin-top:8px;width:100%}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.sum-mobile{display:none}
@media(max-width:800px){
  .billing-grid{grid-template-columns:1fr}
  .summary{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:25;border-radius:16px 16px 0 0;padding:12px 14px;box-shadow:0 -6px 20px #0001}
  .summary .full-lines,.summary .note,.summary h3{display:none}
  .sum-mobile{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .sum-mobile b{font-size:21px}
  .summary .pay{display:flex;gap:8px}
  .summary .pay select{flex:0 0 100px}
  .checkout{margin-top:0}
  .discard{display:none}
  .app{padding-bottom:calc(var(--nav) + 160px + env(safe-area-inset-bottom))}
}
@media(min-width:801px){
  nav{position:static;height:auto;border:0;border-bottom:1px solid var(--border);background:none;padding:0;margin-bottom:20px;justify-content:flex-start;gap:6px}
  .nav-btn{flex:0 0 auto;flex-direction:row;gap:8px;padding:13px 18px;font-size:14px;border-bottom:2px solid transparent}
  .nav-btn.active{border-color:var(--accent);color:var(--text)}
  .nav-btn i{font-size:16px}.dot{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .app{padding-bottom:40px}
}
/* modals: bottom sheet on phone */
.modal-backdrop{display:none;position:fixed;inset:0;background:#0007;z-index:40;align-items:center;justify-content:center;padding:15px}
.modal-backdrop.show{display:flex}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px;padding:20px}
.modal h2{margin:0 0 16px;font-size:20px}
@media(max-width:600px){.modal-backdrop{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
.barcode-row{display:flex;gap:8px}
#reader{width:100%;margin-top:10px}
.toast{position:fixed;bottom:calc(var(--nav) + 90px);left:50%;transform:translateX(-50%);background:#252822;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:60;display:none;max-width:90%;text-align:center}
.toast.show{display:block}
.invoice{display:none}
@media print{
  body{background:#fff}body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000}
  #printArea th,#printArea td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
}
@media(max-width:420px){.form-grid,.two{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Stock<span>Desk.</span></div>
</header>

<nav>
  <button class="nav-btn active" data-page="dashboard"><i>🏠</i>Home</button>
  <button class="nav-btn" data-page="billing"><i>🧾</i>Billing<span class="dot" id="heldDot"></span></button>
  <button class="nav-btn" data-page="inventory"><i>📦</i>Stock</button>
  <button class="nav-btn" data-page="history"><i>🕘</i>History</button>
</nav>

<!-- HOME -->
<section class="page active" id="dashboard">
  <div class="page-heading">
    <div><h1>Overview</h1></div>
    <button class="btn green" onclick="goTo('billing')">+ New Bill</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Products</div><div class="stat-value" id="statProducts">0</div></div>
    <div class="stat"><div class="stat-label">Stock Units</div><div class="stat-value" id="statUnits">0</div></div>
    <div class="stat"><div class="stat-label">Low Stock</div><div class="stat-value" id="statLow">0</div></div>
    <div class="stat"><div class="stat-label">Total Sales</div><div class="stat-value" id="statSales">₹0</div></div>
  </div>
  <div class="panel"><h3>Recent Sales</h3><div id="recentSales" class="list"></div></div>
</section>

<!-- BILLING -->
<section class="page" id="billing">
  <div class="page-heading">
    <div><h1>Billing</h1></div>
  </div>
  <div class="bill-tabs" id="billTabs"></div>

  <div class="billing-grid">
    <div class="stack">
      <div class="panel">
        <div class="two">
          <input id="customerName" placeholder="Customer name" oninput="saveCustomer()">
          <input id="customerPhone" placeholder="Phone" inputmode="tel" oninput="saveCustomer()">
        </div>
        <div class="scan-row">
          <input id="billBarcode" placeholder="Scan or search product" autocomplete="off" oninput="showSuggest()" onkeydown="if(event.key==='Enter')addByBarcode()">
          <button class="btn" onclick="startScanner('bill')">📷</button>
          <div class="suggest" id="suggest"></div>
        </div>
      </div>
      <div class="panel">
        <h3>Items</h3>
        <div id="cartList" class="list"></div>
        <div id="cartEmpty" class="empty">No items</div>
      </div>
    </div>

    <div class="panel summary">
            <div class="sum-mobile"><span class="muted"><span id="mItems">0</span> items</span><b id="mTotal">₹0.00</b></div>
      <div class="full-lines">
        <div class="summary-line"><span class="muted">Items</span><strong id="billItemCount">0</strong></div>
        <div class="summary-line"><span class="muted">Subtotal</span><strong id="billSubtotal">₹0.00</strong></div>
        <div class="summary-line"><span class="muted">Tax</span><strong id="billTax">₹0.00</strong></div>
        <div class="summary-line total"><span>Total</span><span id="billTotal">₹0.00</span></div>
      </div>
      <div class="pay" style="margin-top:12px">
        <select id="paymentMethod" onchange="savePayment()"><option>Cash</option><option>UPI</option><option>Card</option><option>Other</option></select>
        <button class="btn green checkout" onclick="completeSale()">Complete Sale</button>
      </div>
      <button class="btn danger small discard" onclick="discardBill()">Discard this bill</button>
    </div>
  </div>
</section>

<!-- STOCK -->
<section class="page" id="inventory">
  <div class="page-heading">
    <div><h1>Stock</h1></div>
    <button class="btn" onclick="openProductModal()">+ Add</button>
  </div>
  <div class="toolbar">
    <input id="inventorySearch" placeholder="Search name or barcode…" oninput="renderInventory()">
  </div>
  <div id="inventoryList" class="list"></div>
  <div class="toolbar" style="margin-top:18px">
    <button class="btn secondary" style="flex:1" onclick="exportBackup()">⬇ Export Backup</button>
    <button class="btn secondary" style="flex:1" onclick="document.getElementById('importFile').click()">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" hidden onchange="importBackup(event)">
  </div>
</section>

<!-- HISTORY -->
<section class="page" id="history">
  <div class="page-heading"><div><h1>Sales History</h1></div></div>
  <div class="toolbar"><input id="historySearch" placeholder="Invoice, name or phone…" oninput="renderHistory()"></div>
  <div id="historyList" class="list"></div>
</section>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-backdrop" id="productModal">
<div class="modal">
  <h2 id="productModalTitle">Add Product</h2>
  <form id="productForm">
    <input type="hidden" id="productId">
    <div class="form-grid">
      <div class="field full"><label>Product Name *</label><input id="pName" required placeholder="e.g. Shampoo"></div>
      <div class="field full"><label>Barcode</label>
        <div class="barcode-row"><input id="pBarcode" placeholder="Enter or scan"><button type="button" class="btn secondary" onclick="startScanner('product')">📷</button></div>
      </div>
      <div class="field"><label>Purchase Price (₹)</label><input id="pPurchase" type="number" inputmode="decimal" min="0" step="0.01" value="0"></div>
      <div class="field"><label>Selling Price (₹) *</label><input id="pPrice" type="number" inputmode="decimal" min="0" step="0.01" required></div>
      <div class="field"><label>Tax (%)</label><input id="pTax" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="0"></div>
      <div class="field"><label>Quantity *</label><input id="pQty" type="number" inputmode="numeric" min="0" step="1" required value="0"></div>
      <div class="field full"><label>Category</label><input id="pCategory" placeholder="General"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" onclick="closeProductModal()">Cancel</button>
      <button type="submit" class="btn green">Save</button>
    </div>
  </form>
</div></div>

<!-- SCANNER MODAL -->
<div class="modal-backdrop" id="scannerModal" style="z-index:50">
<div class="modal">
  <h2>Scan Barcode</h2>
  <div id="reader"></div>
  <div class="modal-actions"><button class="btn secondary" onclick="stopScanner()">Close</button></div>
</div></div>

<div id="printArea" class="invoice"></div>
<div class="toast" id="toast"></div>

<script>
const PRODUCT_KEY="inventory_products",SALES_KEY="sales_bills",BILLS_KEY="open_bills";
let products=load(PRODUCT_KEY,[]),sales=load(SALES_KEY,[]),bills=load(BILLS_KEY,[]);
let activeId=null,billCounter=0,scanner=null,scannerTarget=null,scannerBusy=false;

function load(k,f){try{const d=JSON.parse(localStorage.getItem(k));return Array.isArray(d)?d:f}catch{return f}}
const saveProducts=()=>localStorage.setItem(PRODUCT_KEY,JSON.stringify(products));
const saveSales=()=>localStorage.setItem(SALES_KEY,JSON.stringify(sales));
const saveBills=()=>localStorage.setItem(BILLS_KEY,JSON.stringify(bills));
const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toFixed(2);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const makeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2500)}

/* NAV */
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");$(b.dataset.page).classList.add("active");
  window.scrollTo(0,0);renderAll();
}));
const goTo=p=>document.querySelector(`[data-page="${p}"]`).click();

/* ===== MULTI-BILL ===== */
function newBill(){
  billCounter++;
  const b={id:makeId(),no:billCounter,name:"",phone:"",payment:"Cash",items:[]};
  bills.push(b);activeId=b.id;saveBills();return b;
}
const cur=()=>bills.find(b=>b.id===activeId)||bills[0];
function switchBill(id){activeId=id;renderBilling();$("billBarcode").value="";$("suggest").classList.remove("show")}
function addBill(){
  const c=cur();
  if(c&&!c.items.length&&!c.name&&!c.phone){toast("Current bill is empty");return}
  newBill();renderBilling();toast("Previous bill on hold");
}
function discardBill(){
  const c=cur();
  if(c.items.length&&!confirm("Discard this bill and its items?"))return;
  bills=bills.filter(b=>b.id!==c.id);
  if(!bills.length)newBill();else activeId=bills[bills.length-1].id;
  saveBills();renderBilling();
}
function saveCustomer(){const c=cur();c.name=$("customerName").value;c.phone=$("customerPhone").value;saveBills();renderTabs()}
function savePayment(){cur().payment=$("paymentMethod").value;saveBills()}
function billTotals(b){
  let sub=0,tax=0,count=0;
  b.items.forEach(i=>{const l=i.price*i.qty;sub+=l;tax+=l*i.tax/100;count+=i.qty});
  return{subtotal:sub,tax,total:sub+tax,count};
}
function renderTabs(){
  $("billTabs").innerHTML=bills.map(b=>{
    const t=billTotals(b);
    return `<button class="bill-tab ${b.id===activeId?"active":""}" onclick="switchBill('${b.id}')">
      <b>${esc(b.name||"Bill "+b.no)}</b><span>${t.count} items · ${money(t.total)}</span></button>`}).join("")
    +`<button class="bill-tab add" onclick="addBill()">+ New bill</button>`;
  const held=bills.filter(b=>b.items.length&&b.id!==activeId).length;
  $("heldDot").textContent=held;$("heldDot").classList.toggle("show",held>0);
}

/* ===== ADD ITEMS ===== */
function addProduct(p){
  if(p.qty<=0){toast("Out of stock.");return}
  const c=cur(),ex=c.items.find(x=>x.productId===p.id);
  if((ex?ex.qty:0)>=p.qty){toast("Not enough stock available.");return}
  if(ex)ex.qty++;else c.items.push({productId:p.id,name:p.name,barcode:p.barcode,price:Number(p.price),tax:Number(p.tax)||0,qty:1});
  saveBills();$("billBarcode").value="";$("suggest").classList.remove("show");
  renderBilling();toast(p.name+" added.");
}
function addByBarcode(){
  const v=$("billBarcode").value.trim();
  if(!v){toast("Enter a barcode");return}
  const p=products.find(x=>String(x.barcode||"").trim()===v);
  if(p)return addProduct(p);
  const m=matches(v);
  if(m.length===1)return addProduct(m[0]);
  toast(m.length?"Pick from the list":"Product not found");
}
const matches=q=>{q=q.toLowerCase();return products.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode||"").toLowerCase().includes(q)).slice(0,6)};
function showSuggest(){
  const v=$("billBarcode").value.trim(),s=$("suggest");
  if(!v){s.classList.remove("show");return}
  const m=matches(v);
  s.innerHTML=m.length?m.map(p=>`<button onclick="addProduct(products.find(x=>x.id==='${p.id}'))"><span>${esc(p.name)}<br><small class="muted">${p.qty} in stock</small></span><strong>${money(p.price)}</strong></button>`).join(""):`<div class="empty" style="padding:14px">No match</div>`;
  s.classList.add("show");
}
function changeQty(id,d){
  const c=cur(),i=c.items.find(x=>x.productId===id),p=products.find(x=>x.id===id);if(!i)return;
  const n=i.qty+d;
  if(n<=0)c.items=c.items.filter(x=>x.productId!==id);
  else{if(!p||n>p.qty){toast("Not enough stock available.");return}i.qty=n}
  saveBills();renderBilling();
}
function renderBilling(){
  const c=cur();
  $("customerName").value=c.name;$("customerPhone").value=c.phone;$("paymentMethod").value=c.payment;
  $("cartEmpty").style.display=c.items.length?"none":"block";
  $("cartList").innerHTML=c.items.map(i=>`
    <div class="card item" style="padding:12px">
      <div><div class="name">${esc(i.name)}</div><small>${money(i.price)}${i.tax?` + ${i.tax}% tax`:""}</small></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="qty"><button onclick="changeQty('${i.productId}',-1)">−</button><strong>${i.qty}</strong><button onclick="changeQty('${i.productId}',1)">+</button></div>
        <strong style="min-width:68px;text-align:right">${money(i.price*i.qty)}</strong>
      </div></div>`).join("");
  const t=billTotals(c);
  $("billItemCount").textContent=t.count;$("billSubtotal").textContent=money(t.subtotal);
  $("billTax").textContent=money(t.tax);$("billTotal").textContent=money(t.total);
  $("mItems").textContent=t.count;$("mTotal").textContent=money(t.total);
  renderTabs();
}

/* ===== COMPLETE SALE ===== */
function nextInvoice(){
  const d=new Date().toISOString().slice(0,10).replace(/-/g,"");
  const n=sales.filter(s=>s.invoice&&s.invoice.startsWith("INV-"+d)).length+1;
  return "INV-"+d+"-"+String(n).padStart(4,"0");
}
function completeSale(){
  const c=cur();
  if(!c.items.length){toast("Add products first.");return}
  for(const i of c.items){
    const p=products.find(x=>x.id===i.productId);
    if(!p){toast(i.name+" no longer exists.");return}
    if(p.qty<i.qty){toast("Not enough stock: "+i.name);return}
  }
  const t=billTotals(c);
  const bill={id:makeId(),invoice:nextInvoice(),date:new Date().toISOString(),
    customerName:c.name.trim()||"Walk-in Customer",customerPhone:c.phone.trim(),payment:c.payment,
    items:c.items.map(i=>({productId:i.productId,name:i.name,barcode:i.barcode,price:i.price,tax:i.tax,qty:i.qty,lineTotal:i.price*i.qty,taxAmount:i.price*i.qty*i.tax/100})),
    subtotal:t.subtotal,tax:t.tax,total:t.total};
  c.items.forEach(i=>{products.find(x=>x.id===i.productId).qty-=i.qty});
  sales.unshift(bill);
  bills=bills.filter(b=>b.id!==c.id);
  if(!bills.length)newBill();else activeId=bills[0].id; // jump to a waiting bill
  saveProducts();saveSales();saveBills();
  renderAll();toast("Sale completed · "+bill.invoice);
  showInvoice(bill.id);
}

/* ===== INVENTORY ===== */
function openProductModal(id=null){
  $("productForm").reset();$("productId").value="";
  $("pPurchase").value=0;$("pTax").value=0;$("pQty").value=0;
  $("productModalTitle").textContent=id?"Edit Product":"Add Product";
  if(id){
    const p=products.find(x=>x.id===id);if(!p)return;
    $("productId").value=p.id;$("pName").value=p.name;$("pBarcode").value=p.barcode||"";
    $("pPurchase").value=p.purchase||0;$("pPrice").value=p.price;$("pTax").value=p.tax||0;
    $("pQty").value=p.qty;$("pCategory").value=p.category||"";
  }
  $("productModal").classList.add("show");
}
const closeProductModal=()=>$("productModal").classList.remove("show");
$("productForm").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("productId").value,barcode=$("pBarcode").value.trim();
  if(products.find(p=>p.barcode&&p.barcode===barcode&&p.id!==id)){toast("This barcode already belongs to another product.");return}
  const p={id:id||makeId(),name:$("pName").value.trim(),barcode,
    purchase:Number($("pPurchase").value)||0,price:Number($("pPrice").value),
    tax:Number($("pTax").value)||0,qty:Number($("pQty").value),category:$("pCategory").value.trim()};
  if(p.price<0||p.purchase<0||p.qty<0||p.tax<0||p.tax>100){toast("Please enter valid values.");return}
  const i=products.findIndex(x=>x.id===id);
  if(i>=0)products[i]=p;else products.push(p);
  saveProducts();closeProductModal();renderAll();toast("Product saved.");
});
function renderInventory(){
  const q=$("inventorySearch").value.toLowerCase();
  const f=products.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode||"").toLowerCase().includes(q));
  $("inventoryList").innerHTML=f.length?f.map(p=>`
    <div class="card">
      <div class="item">
        <div><div class="name">${esc(p.name)}</div><small>${esc(p.category||"General")} · ${esc(p.barcode||"no barcode")}</small></div>
        <div class="right"><strong>${money(p.price)}</strong><br><span class="chip ${p.qty<=5?"low":""}">${p.qty} in stock</span></div>
      </div>
      <div class="card-actions">
        <button class="btn secondary small" onclick="addStock('${p.id}')">+ Stock</button>
        <button class="btn secondary small" onclick="openProductModal('${p.id}')">Edit</button>
        <button class="btn danger small" onclick="deleteProduct('${p.id}')">Delete</button>
      </div></div>`).join(""):`<div class="empty">No products</div>`;
}
function addStock(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const v=prompt("How many units to add to "+p.name+"?");if(v===null)return;
  const n=Number(v);
  if(!Number.isInteger(n)||n<=0){toast("Enter a whole number.");return}
  p.qty+=n;saveProducts();renderAll();toast("Stock updated.");
}
function deleteProduct(id){
  const p=products.find(x=>x.id===id);if(!p||!confirm(`Delete "${p.name}"?`))return;
  products=products.filter(x=>x.id!==id);saveProducts();renderAll();toast("Product deleted.");
}

/* ===== SCANNER ===== */
async function startScanner(t){
  if(typeof Html5Qrcode==="undefined"){toast("Scanner unavailable offline");return}
  scannerTarget=t;$("scannerModal").classList.add("show");
  try{
    scanner=new Html5Qrcode("reader");scannerBusy=true;
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},async txt=>{
      if(!scannerBusy)return;scannerBusy=false;
      const code=txt.trim();await stopScanner();
      if(scannerTarget==="product"){$("pBarcode").value=code;toast("Barcode scanned.")}
      else{$("billBarcode").value=code;addByBarcode()}
    },()=>{});
  }catch(e){scannerBusy=false;$("scannerModal").classList.remove("show");scanner=null;toast("Camera unavailable")}
}
async function stopScanner(){
  scannerBusy=false;
  if(scanner){try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){}scanner=null}
  $("scannerModal").classList.remove("show");
}

/* ===== HISTORY / INVOICE ===== */
function renderHistory(){
  const q=$("historySearch").value.toLowerCase();
  const f=sales.filter(s=>s.invoice.toLowerCase().includes(q)||s.customerName.toLowerCase().includes(q)||(s.customerPhone||"").includes(q));
  $("historyList").innerHTML=f.length?f.map(s=>`
    <div class="card">
      <div class="item"><div><div class="name">${esc(s.invoice)}</div><small>${esc(s.customerName)}${s.customerPhone?" · "+esc(s.customerPhone):""}</small><small>${new Date(s.date).toLocaleString()} · ${esc(s.payment)}</small></div>
      <div class="right"><strong>${money(s.total)}</strong></div></div>
      <div class="card-actions"><button class="btn secondary small" onclick="showInvoice('${s.id}')">View / Print</button></div></div>`).join(""):`<div class="empty">No sales found.</div>`;
}
function showInvoice(id){
  const s=sales.find(x=>x.id===id);if(!s)return;
  $("printArea").innerHTML=`<div style="max-width:700px;margin:auto;font-family:Arial,sans-serif">
    <div style="text-align:center;border-bottom:2px solid #222;padding-bottom:15px"><h1 style="font-size:28px;margin:0">SALES INVOICE</h1></div>
    <div style="display:flex;justify-content:space-between;gap:15px;margin:20px 0">
      <div><strong>Invoice:</strong> ${esc(s.invoice)}<br><strong>Date:</strong> ${new Date(s.date).toLocaleString()}</div>
      <div><strong>Customer:</strong> ${esc(s.customerName)}<br><strong>Phone:</strong> ${esc(s.customerPhone||"—")}</div></div>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Tax</th><th>Total</th></tr></thead>
    <tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${money(i.price)}</td><td>${i.qty}</td><td>${money(i.taxAmount)}</td><td>${money(i.lineTotal+i.taxAmount)}</td></tr>`).join("")}</tbody></table>
    <div style="width:260px;margin:20px 0 0 auto">
      <div style="display:flex;justify-content:space-between;padding:7px"><span>Subtotal</span><strong>${money(s.subtotal)}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:7px"><span>Tax</span><strong>${money(s.tax)}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:12px 7px;border-top:2px solid #222;font-size:20px"><strong>Total</strong><strong>${money(s.total)}</strong></div>
      <div style="padding:7px">Payment: ${esc(s.payment)}</div></div>
    <p style="text-align:center;margin-top:45px">Thank you</p></div>`;
  window.print();
}

/* ===== DASHBOARD ===== */
function renderDashboard(){
  $("statProducts").textContent=products.length;
  $("statUnits").textContent=products.reduce((a,p)=>a+Number(p.qty||0),0);
  $("statLow").textContent=products.filter(p=>p.qty<=5).length;
  $("statSales").textContent=money(sales.reduce((a,s)=>a+Number(s.total||0),0));
  $("recentSales").innerHTML=sales.slice(0,5).map(s=>`<div class="item"><div><div class="name">${esc(s.customerName)}</div><small>${esc(s.invoice)} · ${new Date(s.date).toLocaleDateString()}</small></div><strong>${money(s.total)}</strong></div>`).join("")||`<div class="empty">No sales yet.</div>`;
}
function renderAll(){renderDashboard();renderInventory();renderHistory();renderBilling()}

/* ===== BACKUP ===== */
function exportBackup(){
  const b=new Blob([JSON.stringify({app:"StockDesk",version:1,exportedAt:new Date().toISOString(),products,sales},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stockdesk-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup exported.");
}
function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.products))throw 0;
      if(!confirm("Replace current inventory and sales with this backup?"))return;
      products=d.products;sales=Array.isArray(d.sales)?d.sales:[];
      saveProducts();saveSales();renderAll();toast("Backup imported.");
    }catch{toast("Invalid backup file.")}
    e.target.value="";
  };
  r.readAsText(f);
}

/* ===== INIT ===== */
bills=bills.filter(b=>b&&Array.isArray(b.items));
billCounter=bills.reduce((m,b)=>Math.max(m,b.no||0),0);
if(!bills.length)newBill();else activeId=bills[0].id;
renderAll();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
